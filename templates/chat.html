<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehan's Chat App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ece5dd;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background: #075e54;
            color: white;
            padding: 15px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header a {
            color: white;
            font-size: 14px;
            text-decoration: underline;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .message {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 6px 0;
            max-width: 70%;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .message.own {
            background: #dcf8c6;
            margin-left: auto;
        }
        .message.system {
            background: transparent;
            text-align: center;
            font-size: 12px;
            color: #666;
            max-width: 100%;
        }
        .message b {
            display: block;
            font-size: 12px;
            color: #075e54;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
        }
        #message-input {
            flex: 1;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        #send-btn {
            margin-left: 8px;
            padding: 12px 20px;
            border-radius: 20px;
            border: none;
            background: #075e54;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="header">
        <span>💬 Rehan's Chat App - {{ nickname }}</span>
        <a href="/logout">Logout</a>
    </div>
    <div id="messages">
        {% for msg in history %}
            <div class="message {% if msg.sender_name == nickname %}own{% endif %}">
                <b>{{ 'You' if msg.sender_name == nickname else msg.sender_name }}</b>{{ msg.text }}
            </div>
        {% endfor %}
    </div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type a message" />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io();
        const myNickname = "{{ nickname }}";

        socket.emit('join', { nickname: myNickname });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text === "") return;

            socket.emit('send_message', { nickname: myNickname, text: text });
            input.value = "";
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        socket.on('message', function(data) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');

            if (data.nickname === 'System') {
                msgDiv.className = 'message system';
                msgDiv.innerText = data.text;
            } else {
                const isOwn = data.nickname === myNickname;
                msgDiv.className = 'message' + (isOwn ? ' own' : '');
                msgDiv.innerHTML = `<b>${isOwn ? 'You' : data.nickname}</b>${data.text}`;
            }

            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // scroll to bottom on load (to show latest history)
        const messagesDiv = document.getElementById('messages');
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    </script>
</body>
</html>
